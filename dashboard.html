<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>營運總覽｜iRent 智能車況管家</title>
  <link rel="stylesheet" href="css/common.css"><link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="app-body" data-page="dashboard">
  <div class="app-shell">
    <aside class="app-sidebar" data-app-sidebar></aside>

    <div class="app-workspace">
      <header class="app-topbar" data-app-topbar></header>

      <main class="dashboard-main">
        <section class="dashboard-metrics" aria-label="即時車隊指標">
          <article class="dashboard-metric is-slate" data-fleet-metric="total">
            <span class="metric-visual"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 11h14l-1.3-4A2 2 0 0 0 15.8 5H8.2a2 2 0 0 0-1.9 1.4L5 11Zm-1 3a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4h-2v2h-2v-2H8v2H6v-2H4v-4Zm3 1.5A1.5 1.5 0 1 0 7 12.5a1.5 1.5 0 0 0 0 3Zm10 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/></svg></span>
            <span class="metric-content"><span>車輛總數</span><strong>—</strong></span>
          </article>
          <article class="dashboard-metric is-green" data-fleet-metric="available">
            <span class="metric-visual"><svg aria-hidden="true" data-icon="check" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5-5 1.4 1.4-6.4 6.4Z"/></svg></span>
            <span class="metric-content"><span>可租車輛</span><strong>—</strong></span>
          </article>
          <article class="dashboard-metric is-blue" data-fleet-metric="rented">
            <span class="metric-visual"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-3 9v2H7a3 3 0 0 0-3 3v4h16v-4a3 3 0 0 0-3-3h-2v-2a5 5 0 0 0-3-9Zm0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm-4 11h8a1 1 0 0 1 1 1H7a1 1 0 0 1 1-1Z"/></svg></span>
            <span class="metric-content"><span>租用中</span><strong>—</strong></span>
          </article>
          <article class="dashboard-metric is-amber" data-fleet-metric="cleaning">
            <span class="metric-visual"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 2h6v3l2 2v13H7V7l2-2V2Zm2 3h2V4h-2v1Zm-1 5 2 2 2-2 1.5 1.5-2 2 2 2L14 17l-2-2-2 2-1.5-1.5 2-2-2-2L10 10Z"/></svg></span>
            <span class="metric-content"><span>待清潔</span><strong>—</strong></span>
          </article>
          <article class="dashboard-metric is-red" data-fleet-metric="maintenance">
            <span class="metric-visual"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14.7 4.3a5 5 0 0 0-6.4 6.4L3 16v5h5l5.3-5.3a5 5 0 0 0 6.4-6.4l-3 3-2-2 3-3a5 5 0 0 0-3-3Z"/></svg></span>
            <span class="metric-content"><span>待維修</span><strong>—</strong></span>
          </article>
        </section>

        <section class="dashboard-content-grid" aria-label="車隊營運資訊">
          <article class="region-overview-card dashboard-card">
            <header class="dashboard-card-head"><div><h2>七天租用縣市概覽</h2></div></header>
            <div class="region-map-wrap">
              <div class="region-map-canvas" data-region-overview-chart role="img" aria-label="台灣縣市近七日租借數量氣泡地圖"></div>
              <p class="region-map-message" data-region-map-message>載入縣市租借氣泡資料中…</p>
            </div>
          </article>

          <article class="fleet-trend-card dashboard-card">
            <header class="dashboard-card-head">
              <div><h2>一周內租用狀況</h2></div>
            </header>
            <div class="trend-legend" aria-label="圖表圖例">
              <span><i class="legend-green"></i>總車輛</span>
              <span><i class="legend-blue"></i>當日租用車輛</span>
            </div>
            <div class="trend-chart">
              <div data-fleet-trend-chart role="img" aria-label="一周內租用趨勢圖"></div>
              <p class="trend-chart-message" data-fleet-trend-message>載入趨勢資料中…</p>
            </div>
          </article>

          <!-- 暫時停用：過去七天縣市租借數量圓餅圖
          <article class="rental-city-card dashboard-card">
            <header class="dashboard-card-head"><div><h2>過去七天縣市租借數量</h2><p>依租借開始時間加總</p></div></header>
            <div class="rental-city-chart-wrap">
              <div class="rental-city-chart" data-rental-city-chart role="img" aria-label="過去七天每個縣市租借數量圓餅圖"></div>
              <p class="rental-city-chart-message" data-rental-city-message>載入縣市租借資料中…</p>
            </div>
          </article>
          -->
        </section>

      </main>
    </div>
  </div>
<script src="js/api/client.js" defer></script>
<script src="js/api/dashboard.js" defer></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js" defer></script>
<script src="js/dashboard.js" defer></script>
<script src="js/layout.js" defer></script></body>
</html>
